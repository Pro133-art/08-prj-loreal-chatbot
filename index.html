<!doctype html>
<html lang="en">
  <head>
    <!-- Basic document metadata for correct encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oreal</title>
    <!-- Material Icons is used for the send button icon -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Montserrat is the main UI font for readability and visual consistency -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Decorative background layer (purely visual) -->
    <div class="eternal-circles" aria-hidden="true">
      <span class="circle circle-1"></span>
      <span class="circle circle-2"></span>
      <span class="circle circle-3"></span>
      <span class="circle circle-4"></span>
      <span class="circle circle-5"></span>
      <span class="circle circle-6"></span>
      <span class="circle circle-7"></span>
    </div>

    <div class="page-wrapper">
      <!-- Header / Branding -->
      <header class="site-header">
        <!-- Split title spans allow custom letter styling for the L'Oreal wordmark -->
        <h1 class="site-title">
          <span class="site-title-rest">L'</span>
          <span class="site-title-o">O</span>
          <span class="site-title-rest site-title-rest-end">RÉAL</span>
        </h1>
        <h2 class="site-subtitle">
          Meet <span class="subtitle-name">Ava !</span>
        </h2>
        <h3 class="site-subtitle">Your Elite Product Advisor</h3>
      </header>

      <!-- Main chat experience -->
      <main>
        <section class="chatbox">
          <!-- Chat controls: create, rename, delete, and switch chats -->
          <div class="chat-toolbar">
            <button type="button" id="newChatBtn" class="toolbar-btn">
              New Chat
            </button>

            <button type="button" id="saveChatBtn" class="toolbar-btn">
              Save Chat
            </button>

            <button type="button" id="deleteChatBtn" class="toolbar-btn">
              Delete Chat
            </button>

            <!-- Hidden label keeps the select accessible to screen readers -->
            <label for="chatLibrarySelect" class="visually-hidden">
              Select saved chat
            </label>
            <select id="chatLibrarySelect" class="chat-library-select"></select>
          </div>

          <!-- Messages are rendered here by script.js -->
          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <!-- User input form -->
          <form id="chatForm" class="chat-form">
            <!-- Hidden label gives accessible context for assistive technology -->
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <!-- Icon-only button includes hidden text so screen readers announce action -->
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; 2025 Company Name. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
